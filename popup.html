<!DOCTYPE html>
<html>
  <head>
    <title>Car Deal Finder</title>
    <script src="chart.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 480px; font-family: 'Segoe UI', Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; }
      .header { background: linear-gradient(135deg, #181825, #1e1e2e); padding: 16px 20px 0px 20px; border-bottom: 2px solid #cba6f7; position: sticky; top: 0; z-index: 10; }
      .header h1 { font-size: 18px; color: #cba6f7; letter-spacing: 1px; margin-bottom: 12px; }
      .tabs { display: flex; gap: 4px; }
      .tab { padding: 8px 20px; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; cursor: pointer; border-radius: 6px 6px 0 0; color: #6c7086; background: transparent; border: none; transition: all 0.2s; }
      .tab.active { background: #1e1e2e; color: #cba6f7; border-top: 2px solid #cba6f7; }
      .tab:hover:not(.active) { color: #cdd6f4; }
      #listPanel { display: block; max-height: 600px; overflow-y: auto; padding: 12px; }
      #listPanel::-webkit-scrollbar { width: 4px; }
      #listPanel::-webkit-scrollbar-track { background: #1e1e2e; }
      #listPanel::-webkit-scrollbar-thumb { background: #cba6f7; border-radius: 2px; }
      #results { display: flex; flex-direction: column; gap: 12px; }
      .car-card { background: #313244; border-radius: 10px; overflow: hidden; border: 1px solid #45475a; transition: border 0.2s; }
      .car-card:hover { border-color: #cba6f7; }
      .car-image { width: 100%; height: 200px; object-fit: cover; display: block; }
      .car-body { padding: 12px; }
      .car-title { font-size: 13px; font-weight: bold; color: #cba6f7; cursor: pointer; margin-bottom: 8px; line-height: 1.4; }
      .car-title:hover { text-decoration: underline; }
      .car-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
      .stat { background: #181825; border-radius: 6px; padding: 6px 8px; text-align: center; }
      .stat-label { font-size: 9px; color: #6c7086; text-transform: uppercase; letter-spacing: 0.5px; }
      .stat-value { font-size: 12px; font-weight: bold; color: #cdd6f4; margin-top: 2px; }
      .score-row { display: flex; align-items: center; justify-content: space-between; }
      .deal-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .great { background: #a6e3a1; color: #1e1e2e; }
      .fair { background: #fab387; color: #1e1e2e; }
      .overpriced { background: #f38ba8; color: #1e1e2e; }
      .score-number { font-size: 22px; font-weight: bold; color: #cdd6f4; }
      .score-number span { font-size: 11px; color: #6c7086; }
      .subscores { display: flex; gap: 6px; margin-top: 8px; }
      .subscore { flex: 1; background: #181825; border-radius: 6px; padding: 4px 6px; text-align: center; }
      .subscore-label { font-size: 9px; color: #6c7086; text-transform: uppercase; }
      .subscore-value { font-size: 11px; font-weight: bold; color: #bac2de; }
      #graphPanel { display: none; padding: 16px; position: relative; }
      .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 11px; }
      .legend-item { display: flex; align-items: center; gap: 5px; color: #bac2de; }
      .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
      #scatterChart { width: 100% !important; }
      .empty { text-align: center; padding: 40px 20px; color: #6c7086; font-size: 13px; line-height: 1.6; }

      /* Custom tooltip for graph */
      #graphTooltip {
        position: fixed;
        display: none;
        background: #313244;
        border: 1px solid #cba6f7;
        border-radius: 10px;
        padding: 0;
        z-index: 9999;
        width: 200px;
        overflow: hidden;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      }
      #graphTooltip img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        display: block;
      }
      #graphTooltip .tt-body {
        padding: 10px;
      }
      #graphTooltip .tt-title {
        font-size: 11px;
        font-weight: bold;
        color: #cba6f7;
        margin-bottom: 6px;
        line-height: 1.3;
      }
      #graphTooltip .tt-row {
        font-size: 10px;
        color: #bac2de;
        margin-bottom: 3px;
      }
      #graphTooltip .tt-score {
        font-size: 12px;
        font-weight: bold;
        color: #cdd6f4;
        margin-top: 6px;
      }
      #graphTooltip .tt-hint {
        font-size: 9px;
        color: #6c7086;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>CAR DEAL FINDER</h1>
      <div class="tabs">
        <button class="tab active" id="tabList">List View</button>
        <button class="tab" id="tabGraph">Market Graph</button>
      </div>
    </div>
    <div id="listPanel">
      <div id="results">
        <div class="empty">No listings analysed yet.<br>Go to DoneDeal and search for a car.</div>
      </div>
    </div>
    <div id="graphPanel">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#a6e3a1"></div>Great Deal</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fab387"></div>Fair Deal</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f38ba8"></div>Overpriced</div>
      </div>
      <canvas id="scatterChart"></canvas>
    </div>
    <div id="graphTooltip">
      <img id="ttImage" src="" alt="">
      <div class="tt-body">
        <div class="tt-title" id="ttTitle"></div>
        <div class="tt-row" id="ttPrice"></div>
        <div class="tt-row" id="ttYear"></div>
        <div class="tt-row" id="ttMileage"></div>
        <div class="tt-score" id="ttScore"></div>
        <div class="tt-hint">Click dot to open listing</div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
